version: '3.8'

services:
  web:
    build: .
    image: pgpc-app:latest
    container_name: pgpc_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - pgpc-internal

  db:
    image: postgres:15
    container_name: pgpc_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pgpc-internal

  queue:
    build: .
    image: pgpc-app:latest
    container_name: pgpc_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - pgpc-internal

volumes:
  pgdata:

networks:
  pgpc-internal:
    external: true